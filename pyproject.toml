[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-pack"
version = "0.6.0"
description = "Offline-first toolkit for building bilingual Reading Packs for books"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/CC-BY-4.0.txt", "LICENSES/README.md"]
authors = [
  { name = "Koichi Takahashi" },
]
keywords = ["books", "publishing", "reading-pack", "conversational-edition"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "jsonschema>=4.18,<5",
]

[project.scripts]
reading-pack = "reading_pack.cli:main"

[project.urls]
Documentation = "https://github.com/ktakahashi74/reading-pack"
Source = "https://github.com/ktakahashi74/reading-pack"
Issues = "https://github.com/ktakahashi74/reading-pack/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reading_pack = ["defaults/*.md"]

[tool.setuptools.data-files]
"share/reading-pack/schema" = ["schema/*.schema.json"]
